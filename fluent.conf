# Receives container logs from Docker's or nerdctl's fluentd logging driver and ships them to Loki.
# Each record is one line of output in `log`, plus metadata: Docker sends container_id, container_name and
# source; nerdctl sends container_id, namespace and source.
# Containers opt in with the tag `loki.<job>`; <job> becomes the Loki `job` label.

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter loki.**>
  @type record_transformer
  <record>
    job ${tag_parts[1]}
  </record>
</filter>

<match loki.**>
  @type loki
  url "#{ENV['LOKI_URL']}"
  username "#{ENV['LOKI_USERNAME']}"
  password "#{ENV['LOKI_PASSWORD']}"
  # Optional labels on every line, as JSON, e.g. {"host":"pi-1"}
  extra_labels "#{ENV['LOKI_EXTRA_LABELS'] || '{}'}"

  # Low-cardinality labels only; source is stdout or stderr. container_name is Docker-only, absent from nerdctl's records.
  <label>
    job
    container_name
    source
  </label>

  # Leaves just `log`, which drop_single_key sends as the bare line
  remove_keys container_id,container_name,namespace,source,job
  line_format key_value
  drop_single_key true

  <buffer>
    flush_interval 10s
    flush_at_shutdown true
  </buffer>
</match>

# Anything not tagged loki.* is discarded rather than piling up as unmatched-tag warnings
<match **>
  @type null
</match>
